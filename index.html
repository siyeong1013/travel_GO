<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="여행 일정과 경비를 한곳에서 관리하고, 동행자와 정산해요." />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Home screen app on iOS: full screen, white status bar with dark text (like the app's headers). -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="travel GO" />
    <title>travel GO</title>
    <!-- Start screen, drawn before the app's code runs; src/app/splash.ts fades it out. -->
    <style>
      #splash {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        background: #fff;
        transition: opacity 300ms ease;
      }
      #splash.splash-hidden {
        opacity: 0;
        pointer-events: none;
      }
      .no-splash #splash {
        display: none;
      }
      #splash svg {
        width: 96px;
        height: 96px;
        animation: splash-in 450ms cubic-bezier(0.2, 0.8, 0.2, 1) both;
      }
      #splash p {
        margin: 0;
        font:
          800 30px/1 'Pretendard Variable',
          Pretendard,
          -apple-system,
          BlinkMacSystemFont,
          system-ui,
          'Apple SD Gothic Neo',
          'Noto Sans KR',
          sans-serif;
        letter-spacing: -0.02em;
        color: #111827;
        animation: splash-in 450ms 80ms cubic-bezier(0.2, 0.8, 0.2, 1) both;
      }
      #splash p span {
        color: #1d64e0;
      }
      @keyframes splash-in {
        from {
          opacity: 0;
          transform: translateY(8px) scale(0.96);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash svg,
        #splash p {
          animation: none;
        }
      }
    </style>
    <script>
      // Once per tab: not again on a reload (e.g. the one after an update).
      try {
        if (sessionStorage.getItem('travel-go:splash-shown')) {
          document.documentElement.classList.add('no-splash');
        } else {
          sessionStorage.setItem('travel-go:splash-shown', '1');
        }
      } catch {
        // Site data blocked: it shows every time.
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <div id="splash" aria-hidden="true">
      <!-- The app icon (public/favicon.svg), inline so it shows on the first paint. -->
      <svg viewBox="0 0 512 512">
        <defs>
          <linearGradient id="splash-bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#4b93ff" />
            <stop offset="1" stop-color="#1d64e0" />
          </linearGradient>
        </defs>
        <rect width="512" height="512" rx="112" fill="url(#splash-bg)" />
        <path
          transform="rotate(45 256 256)"
          d="M256 88C292 88 298 124 298 160V300L278 404Q278 426 256 426Q234 426 234 404L214 300V160C214 124 220 88 256 88ZM298 214L422 300V326L298 292ZM214 214L90 300V326L214 292ZM282 364L354 402V420L278 412ZM230 364L158 402V420L234 412Z"
          fill="#fff"
          stroke="#fff"
          stroke-width="20"
          stroke-linejoin="round"
        />
        <circle cx="256" cy="256" r="32" fill="url(#splash-bg)" />
      </svg>
      <p>travel <span>GO</span></p>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
